---
# GitHub Actions workflow for Invariant 2 testing
#
# This workflow runs the invariant test suite on every push and PR.
# It creates a temporary Postgres database, runs the tests, and reports results.
#
# To enable in your repository:
# 1. Ensure this file is at .github/workflows/invariant-2-test.yml
# 2. GitHub Actions will automatically pick it up
# 3. Check the Actions tab for results

name: Invariant 2 Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  invariant-2-test:
    name: Test Invariant 2 (No out-of-range days)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install psycopg[binary]

      - name: Run Invariant 2 tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          python3 migration/test_invariant_2.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariant-2-results
          path: |
            /tmp/test_invariant_2_*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = `## ✅ Invariant 2 Tests Passed

            All tests passed for Invariant 2 (No out-of-range days in repo_user_daily_tool).

            - ✅ Detects 2170-dated rows
            - ✅ Detects pre-2005 rows
            - ✅ No false positives on valid data

            See [docs/invariant-2-implementation.md](docs/invariant-2-implementation.md) for details.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
