---
# Kubernetes CronJob for periodic Invariant 2 audits
#
# This CronJob runs the invariant audit script every 6 hours against production.
# If violations are detected, it sends a Slack alert and fails (which triggers
# Kubernetes alerting).
#
# To deploy:
#   kubectl apply -f k8s/invariant-2-audit-cronjob.yaml
#
# To run manually:
#   kubectl create job --from=cronjob/invariant-2-audit manual-audit-$(date +%s)
#
# Environment variables (set via Secret or ConfigMap):
#   POSTGRES_HOST - Postgres host
#   POSTGRES_PORT - Postgres port (default: 5432)
#   POSTGRES_DB - Database name
#   POSTGRES_USER - Postgres user
#   POSTGRES_PASSWORD_FILE - Path to password file in Secret
#   SLACK_WEBHOOK_URL - Optional: Slack webhook for alerts
apiVersion: batch/v1
kind: CronJob
metadata:
  name: invariant-2-audit
  namespace: commitgraph
  labels:
    app: invariant-audit
    invariant: "2"
spec:
  # Run every 6 hours (at minute 0 past hours 0, 6, 12, 18)
  schedule: "0 */6 * * *"
  # Keep successful jobs for 24h, failed jobs for 7 days
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 28
  concurrencyPolicy: Forbid  # Don't run if previous job hasn't finished
  jobTemplate:
    metadata:
      labels:
        app: invariant-audit
        invariant: "2"
    spec:
      # Deadline for job completion (10 minutes)
      activeDeadlineSeconds: 600
      # Retry on failure (up to 2 times)
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: invariant-audit
            invariant: "2"
        spec:
          restartPolicy: OnFailure
          containers:
          - name: audit
            image: postgres:16-alpine
            command:
            - /bin/bash
            - /scripts/audit-invariant-2.sh
            - production
            env:
            - name: POSTGRES_HOST
              value: "postgres-commitgraph"  # Update with actual Postgres service name
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "commitgraph"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD_FILE
              value: "/etc/postgres-password/password"
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alert-webhooks
                  key: slack-invariant-violation
                  optional: true  # Don't fail if webhook not configured
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: postgres-password
              mountPath: /etc/postgres-password
              readOnly: true
            resources:
              requests:
                cpu: 100m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 128Mi
          volumes:
          - name: scripts
            configMap:
              name: invariant-audit-scripts
              defaultMode: 0755
          - name: postgres-password
            secret:
              secretName: postgres-credentials
              items:
              - key: password
                path: password
                mode: 0400
---
# ConfigMap containing the audit scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: invariant-audit-scripts
  namespace: commitgraph
data:
  audit-invariant-2.sh: |
    #!/usr/bin/env bash
    #
    # Production audit script for Invariant 2: No out-of-range days
    # (Embedded here for ConfigMap - source at scripts/audit-invariant-2.sh)
    #
    # Exit codes: 0=pass, 1=violations, 2=error

    set -euo pipefail

    # Configuration
    INVARIANT_SQL="${INVARIANT_SQL:-/invariants/invariant_2_no_out_of_range_days.sql}"
    ENVIRONMENT="${ENVIRONMENT:-production}"

    # Required environment variables
    if [[ -z "${POSTGRES_DB:-}" ]]; then
      echo "ERROR: POSTGRES_DB required" >&2
      exit 2
    fi

    if [[ -z "${POSTGRES_USER:-}" ]]; then
      echo "ERROR: POSTGRES_USER required" >&2
      exit 2
    fi

    if [[ -z "${POSTGRES_PASSWORD_FILE:-}" ]]; then
      echo "ERROR: POSTGRES_PASSWORD_FILE required" >&2
      exit 2
    fi

    # Read password
    POSTGRES_PASSWORD=$(cat "${POSTGRES_PASSWORD_FILE}")

    echo "========================================"
    echo "Invariant 2 Audit: ${ENVIRONMENT}"
    echo "========================================"
    echo "Database: ${POSTGRES_DB}"
    echo ""

    # Run the invariant SQL
    VIOLATIONS=$(PGPASSWORD="${POSTGRES_PASSWORD}" psql \
        -h "${POSTGRES_HOST}" \
        -p "${POSTGRES_PORT:-5432}" \
        -d "${POSTGRES_DB}" \
        -U "${POSTGRES_USER}" \
        -t -A -F ' ' \
        -f "${INVARIANT_SQL}" \
        2>&1) || true

    # Check for errors
    if [[ "${VIOLATIONS}" == *"ERROR:"* ]]; then
      echo "❌ ERROR: Failed to execute query" >&2
      echo "${VIOLATIONS}" >&2
      exit 2
    fi

    # Count violations
    VIOLATION_COUNT=0
    if [[ -n "${VIOLATIONS}" ]]; then
      VIOLATION_COUNT=$(echo "${VIOLATIONS}" | grep -c '^[^[:space:]]' || true)
    fi

    echo "Violations found: ${VIOLATION_COUNT}"
    echo ""

    if [[ "${VIOLATION_COUNT}" -eq 0 ]]; then
      echo "✅ PASS: No out-of-range dates"
      exit 0
    else
      echo "❌ FAIL: ${VIOLATION_COUNT} violations"
      echo "${VIOLATIONS}"
      echo ""

      # Create alert
      ALERT_MESSAGE="🚨 Invariant 2 Violation in ${ENVIRONMENT}: ${VIOLATION_COUNT} rows with out-of-range dates"

      if [[ -n "${SLACK_WEBHOOK_URL:-}" ]]; then
        curl -s -X POST "${SLACK_WEBHOOK_URL}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \"${ALERT_MESSAGE}\"}" || true
      fi

      echo "${ALERT_MESSAGE}" >&2
      exit 1
    fi
---
# ConfigMap for the invariant SQL files
apiVersion: v1
kind: ConfigMap
metadata:
  name: invariant-sql-files
  namespace: commitgraph
data:
  invariant_2_no_out_of_range_days.sql: |
    -- Invariant 2: No out-of-range days in repo_user_daily_tool
    -- Expected: 0 rows (no violations)
    -- Returns: Violation rows (repo_id, repo details, user, tool, day, commits)

    SELECT
        rut.repo_id,
        r.provider,
        r.repo_full_name,
        rut.user_id,
        u.login,
        rut.tool,
        rut.day,
        rut.commits,
        rut.insert_time
    FROM repo_user_daily_tool rut
    JOIN repos r ON rut.repo_id = r.repo_id
    JOIN users u ON rut.user_id = u.user_id
    WHERE
        rut.day < '2005-01-01'::DATE
        OR rut.day > (CURRENT_DATE + INTERVAL '1 day')::DATE
    ORDER BY rut.day DESC;
