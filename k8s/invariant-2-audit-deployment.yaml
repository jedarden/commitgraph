---
# Periodic Invariant 2 audit — runs every 6 hours against production.
#
# NOTE: this was originally written as a `kind: CronJob`. CronJob and Job are
# BANNED org-wide: ArgoCD cannot manage them idempotently, and CronJob-spawned
# Job pods are not owned by ArgoCD, so they are never pruned and hold CPU/memory
# reservations indefinitely. The sanctioned pattern is a long-running Deployment
# with an internal scheduling loop, which is what this is.
#
# Deploy via declarative-config + ArgoCD — never `kubectl apply`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invariant-2-audit
  namespace: commitgraph
  labels:
    app: invariant-audit
    invariant: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: invariant-audit
      invariant: "2"
  template:
    metadata:
      labels:
        app: invariant-audit
        invariant: "2"
    spec:
      containers:
      - name: audit
        image: postgres:16-alpine
        command:
        - /bin/bash
        - -c
        - |
          # Internal scheduler: replaces `schedule: "0 */6 * * *"`.
          # A single looping process is inherently `concurrencyPolicy: Forbid`.
          # The audit is wrapped in `timeout` to preserve the old
          # activeDeadlineSeconds: 600. A failed audit must NOT exit the
          # container — that would crash-loop the Deployment and lose the
          # schedule; it logs, alerts, and waits for the next cycle.
          set -uo pipefail
          INTERVAL="${AUDIT_INTERVAL_SECONDS:-21600}"
          while true; do
            echo "[invariant-2-audit] starting audit at $(date -Is)"
            if timeout 600 /bin/bash /scripts/audit-invariant-2.sh production; then
              echo "[invariant-2-audit] audit passed at $(date -Is)"
            else
              echo "[invariant-2-audit] AUDIT FAILED (exit $?) at $(date -Is)" >&2
            fi
            echo "[invariant-2-audit] sleeping ${INTERVAL}s"
            sleep "${INTERVAL}"
          done
        env:
        - name: AUDIT_INTERVAL_SECONDS
          value: "21600"   # 6 hours
        - name: POSTGRES_HOST
          value: "postgres-commitgraph"  # Update with actual Postgres service name
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "commitgraph"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: username
        - name: POSTGRES_PASSWORD_FILE
          value: "/etc/postgres-password/password"
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: alert-webhooks
              key: slack-invariant-violation
              optional: true
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: postgres-password
          mountPath: /etc/postgres-password
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
      volumes:
      - name: scripts
        configMap:
          name: invariant-audit-scripts
          defaultMode: 0755
      - name: postgres-password
        secret:
          secretName: postgres-credentials
          items:
          - key: password
            path: password
            mode: 0400
---
# ConfigMap containing the audit scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: invariant-audit-scripts
  namespace: commitgraph
data:
  audit-invariant-2.sh: |
    #!/usr/bin/env bash
    #
    # Production audit script for Invariant 2: No out-of-range days
    # (Embedded here for ConfigMap - source at scripts/audit-invariant-2.sh)
    #
    # Exit codes: 0=pass, 1=violations, 2=error

    set -euo pipefail

    # Configuration
    INVARIANT_SQL="${INVARIANT_SQL:-/invariants/invariant_2_no_out_of_range_days.sql}"
    ENVIRONMENT="${ENVIRONMENT:-production}"

    # Required environment variables
    if [[ -z "${POSTGRES_DB:-}" ]]; then
      echo "ERROR: POSTGRES_DB required" >&2
      exit 2
    fi

    if [[ -z "${POSTGRES_USER:-}" ]]; then
      echo "ERROR: POSTGRES_USER required" >&2
      exit 2
    fi

    if [[ -z "${POSTGRES_PASSWORD_FILE:-}" ]]; then
      echo "ERROR: POSTGRES_PASSWORD_FILE required" >&2
      exit 2
    fi

    # Read password
    POSTGRES_PASSWORD=$(cat "${POSTGRES_PASSWORD_FILE}")

    echo "========================================"
    echo "Invariant 2 Audit: ${ENVIRONMENT}"
    echo "========================================"
    echo "Database: ${POSTGRES_DB}"
    echo ""

    # Run the invariant SQL
    VIOLATIONS=$(PGPASSWORD="${POSTGRES_PASSWORD}" psql \
        -h "${POSTGRES_HOST}" \
        -p "${POSTGRES_PORT:-5432}" \
        -d "${POSTGRES_DB}" \
        -U "${POSTGRES_USER}" \
        -t -A -F ' ' \
        -f "${INVARIANT_SQL}" \
        2>&1) || true

    # Check for errors
    if [[ "${VIOLATIONS}" == *"ERROR:"* ]]; then
      echo "❌ ERROR: Failed to execute query" >&2
      echo "${VIOLATIONS}" >&2
      exit 2
    fi

    # Count violations
    VIOLATION_COUNT=0
    if [[ -n "${VIOLATIONS}" ]]; then
      VIOLATION_COUNT=$(echo "${VIOLATIONS}" | grep -c '^[^[:space:]]' || true)
    fi

    echo "Violations found: ${VIOLATION_COUNT}"
    echo ""

    if [[ "${VIOLATION_COUNT}" -eq 0 ]]; then
      echo "✅ PASS: No out-of-range dates"
      exit 0
    else
      echo "❌ FAIL: ${VIOLATION_COUNT} violations"
      echo "${VIOLATIONS}"
      echo ""

      # Create alert
      ALERT_MESSAGE="🚨 Invariant 2 Violation in ${ENVIRONMENT}: ${VIOLATION_COUNT} rows with out-of-range dates"

      if [[ -n "${SLACK_WEBHOOK_URL:-}" ]]; then
        curl -s -X POST "${SLACK_WEBHOOK_URL}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \"${ALERT_MESSAGE}\"}" || true
      fi

      echo "${ALERT_MESSAGE}" >&2
      exit 1
    fi
---
# ConfigMap for the invariant SQL files
apiVersion: v1
kind: ConfigMap
metadata:
  name: invariant-sql-files
  namespace: commitgraph
data:
  invariant_2_no_out_of_range_days.sql: |
    -- Invariant 2: No out-of-range days in repo_user_daily_tool
    -- Expected: 0 rows (no violations)
    -- Returns: Violation rows (repo_id, repo details, user, tool, day, commits)

    SELECT
        rut.repo_id,
        r.provider,
        r.repo_full_name,
        rut.user_id,
        u.login,
        rut.tool,
        rut.day,
        rut.commits,
        rut.insert_time
    FROM repo_user_daily_tool rut
    JOIN repos r ON rut.repo_id = r.repo_id
    JOIN users u ON rut.user_id = u.user_id
    WHERE
        rut.day < '2005-01-01'::DATE
        OR rut.day > (CURRENT_DATE + INTERVAL '1 day')::DATE
    ORDER BY rut.day DESC;
