# Example Kubernetes Job for running goose migrations
# This is a reference manifest for Phase 0 deployment
# Actual deployment would be in declarative-config with proper secret references
#
# Usage:
#   kubectl apply -f example-job.yaml
#   kubectl logs job/commitgraph-migrate
#   kubectl delete job commitgraph-migrate

apiVersion: batch/v1
kind: Job
metadata:
  name: commitgraph-migrate
  namespace: commitgraph  # Adjust to actual namespace
spec:
  template:
    spec:
      containers:
      - name: goose
        image: ghcr.io/pressly/goose:latest
        command:
        - goose
        - postgres
        - "user=$(POSTGRES_USER) password=$(POSTGRES_PASSWORD) host=$(POSTGRES_HOST) port=$(POSTGRES_PORT) dbname=$(POSTGRES_DB) sslmode=require"
        - up
        env:
        - name: POSTGRES_HOST
          value: commitgraph-rw.commitgraph.svc  # CNPG read-write service
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: commitgraph-app
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: commitgraph-app
              key: password
        - name: POSTGRES_DB
          value: commitgraph
        - name: POSTGRES_PORT
          value: "5432"
      restartPolicy: Never
  backoffLimit: 3  # Allow retries for transient failures
